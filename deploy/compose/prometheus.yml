# Prometheus configuration for GVStress monitoring.
#
# This configuration scrapes:
#   - node_exporter: standard host metrics (CPU, memory, disk, network)
#   - gvstress-node: GVStress application metrics (test state, verdict, packets)
#
# NOTE: When running in Docker Compose, node_exporter and gvstress metrics
# are accessed via the Docker bridge network. For production deployments,
# run Prometheus natively and scrape node_exporter on the host network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "gvstress-node"

  - job_name: "gvstress-node"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          instance: "gvstress-node"
          role: "controller"
