# GVStress Single-Node Monitoring Stack
#
# Services: Prometheus, Grafana, node_exporter
#
# WARNING: Docker bridge networking introduces NAT, MTU changes, and packet
# overhead. This compose file is suitable ONLY for:
#   - Development and feature testing
#   - Dashboard/UI validation
#   - Demonstration with low traffic
#
# NOT suitable for performance-sensitive pktgen traffic or accurate benchmarks.
# For production, run monitoring components natively with systemd.
#
# Usage:
#   export GVSTRESS_GRAFANA_ADMIN_PASSWORD="$(openssl rand -base64 24)"
#   docker compose -f deploy/compose/docker-compose.single.yml up -d
#   docker compose -f deploy/compose/docker-compose.single.yml down

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gvstress-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: gvstress-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.0
    container_name: gvstress-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GVSTRESS_GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
