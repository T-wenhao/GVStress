generator:
  cameras:
    - ip_address: 192.168.10.11
      interface_name: enp1s0f0
      serial_number: CAM-001
      genicam_filename: camera-a.xml
      gvsp_lost_ratio: 0.0
    - ip_address: 192.168.10.12
      interface_name: enp1s0f1
      serial_number: CAM-002
      genicam_filename: camera-b.xml
      gvsp_lost_ratio: 0.0
    - ip_address: 192.168.10.13
      interface_name: enp2s0f0
      serial_number: CAM-003
      genicam_filename: camera-c.xml
      gvsp_lost_ratio: 0.0
    - ip_address: 192.168.10.14
      interface_name: enp2s0f1
      serial_number: CAM-004
      genicam_filename: camera-d.xml
      gvsp_lost_ratio: 0.0
dut:
  ifaces: [eno1, eno2, eno3, eno4]
  sample_interval_ms: 1000
  collect:
    nic: true
    stream: true
    system: true
stream:
  packet_resend: true
  socket_buffer: true
  socket_buffer_size: 1048576
  frame_retention: 200000
  initial_packet_timeout: 1000
  packet_timeout: 2000
  packet_request_ratio: 0.25
  receiver_priority: 0
scenarios:
  - name: four_stream
    duration: 300
    warmup: 10
    cooldown: 5
pktgen:
  interfaces: [eno1, eno2, eno3, eno4]
  duration: 300
  packet_size: 1500
  rate_mbps: 1000
output:
  root: artifacts/run-001
  raw_dir: artifacts/run-001/raw
  reports_dir: artifacts/run-001/reports
  logs_dir: artifacts/run-001/logs
  evidence_dir: artifacts/run-001/evidence
